[project]
name = "dbos-k8s-multi-version"
version = "0.1.3"
description = "PoC: DBOS multi-version drain-to-empty on Kubernetes"
readme = "README.md"
requires-python = ">=3.13"

dependencies = [
    "dbos>=2.29.0",
    "fastapi>=0.115",
    "kubernetes>=36.0.3",
    "psycopg2-binary>=2.9.12",
    "pydantic-settings>=2.0",
    "structlog>=26.1.0",
    "uvicorn>=0.34",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.3",
    "ty>=0.0.71",
    "ipython>=9.16.1",
]
