# One Deployment for each DBOS version — v0, v1 — not for each release.
#
# The name carries the DBOS version, which is the MAJOR component of
# project.version (see poc/config.py dbos_version). That single choice decides
# which of two very different things a deploy does:
#
#   * 0.1.2 -> 0.1.3, or 0.1.3 -> 0.2.0. Same DBOS version, so this same object
#     is re-applied with a new image and Kubernetes performs an ordinary rolling
#     update. Safe without any draining: the new pods share the old pods'
#     application_version, so they may dequeue that work directly, and orphan
#     recovery hands them any PENDING rows. Most deploys take this path.
#   * 0.2.0 -> 1.0.0. New DBOS version, so a NEW Deployment appears beside this
#     one. Nothing is replaced. The old fleet keeps its pods Running, loses its
#     API traffic when k8s/26-service.yaml moves its selector, and finishes the
#     backlog it already owns — for an hour, if that is how long it takes.
#
# `make retire`, run from cron every five minutes, deletes this object once its
# version owns no active work, or once it has coexisted with a newer version
# past RETIRE_MAX_AGE_SEC. That deletion is what finally sends SIGTERM to these
# pods. The app itself cannot do it: it has no rights to write to the cluster.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: __DEPLOY_NAME__
  namespace: dbos-poc
  labels:
    app: dbos-poc
    # Read by `make retire` to find this fleet and delete it. It is on the
    # Deployment as well as the pods, so a version is identifiable even before
    # its pods exist.
    version: "__VERSION__"
spec:
  replicas: __REPLICAS__
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # For the same-DBOS-version path only. maxUnavailable: 0 is load-bearing:
      # a pod leaving without draining relies on a live sibling of its own
      # version to adopt its PENDING rows, so there must always be one.
      maxSurge: 100%
      maxUnavailable: 0
  selector:
    matchLabels:
      app: dbos-poc
      # Includes the version, so this Deployment only ever owns its own pods.
      # Without it, every Deployment would claim every app pod.
      version: "__VERSION__"
  template:
    metadata:
      labels:
        app: dbos-poc
        # Read by poc/k8s.py: this is how the API server answers "which executors
        # of version X are alive". The DBOS version, so it does not churn on a
        # patch release.
        version: "__VERSION__"
        # Observability only, never read by any logic: which release is running
        # inside this DBOS version.
        code-version: "__CODE_VERSION__"
    spec:
      # The ceiling for an UNPLANNED stop only — a node drain, an eviction, or the
      # retirement delete once this version is already drained. A planned
      # retirement never runs out of time here, because nothing sends SIGTERM
      # until the work is finished.
      #
      # INVARIANT: drain + margin <= grace, which the app checks at startup.
      #   drain 100s + margin 20s = 120s
      #
      # Kept short deliberately. A grace period is a promise the platform may not
      # keep: `kubectl drain` waits it out in full, cluster-autoscaler
      # force-deletes after --max-graceful-termination-sec (10 minutes by
      # default), and spot preemption gives 30s-2min. Long work is handled by
      # outliving the rollout, not by a longer grace period.
      terminationGracePeriodSeconds: 120
      serviceAccountName: dbos-poc
      initContainers:
        - name: wait-for-postgres
          image: postgres:17-alpine
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef: { name: dbos-poc-db, key: POSTGRES_USER }
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef: { name: dbos-poc-db, key: POSTGRES_DB }
          command:
            - sh
            - -c
            - until pg_isready -h postgres -U "$POSTGRES_USER" -d "$POSTGRES_DB"; do sleep 1; done
      containers:
        - name: app
          image: __IMAGE__
          imagePullPolicy: Never
          ports:
            # Named, because k8s/26-service.yaml targets the name rather than the
            # number. The port can move without touching the Service.
            - name: http
              containerPort: 8080
          # No preStop hook. Its usual job is to delay SIGTERM while a Service
          # drops the pod from its endpoints. Here the Service selector moves to
          # the new version instead, long before SIGTERM, so a hook would only
          # delay the drain — and one that outlasts the grace period gives the
          # kubelet a shutdown it cannot finish on time.
          volumeMounts:
            # The database URL arrives as a file, not an environment variable:
            # k8s/05-secret.yaml projected at /app/.env, which is exactly where
            # pydantic-settings looks (`env_file=".env"` in poc/config.py, and
            # the image's WORKDIR is /app). subPath mounts the single file
            # without shadowing the rest of /app.
            - name: dotenv
              mountPath: /app/.env
              subPath: .env
              readOnly: true
          env:
            # DBOS derives executor_id from DBOS__VMID, falling back to the shared
            # literal "local". An executor id identifies one running process, so
            # every replica needs its own: with a shared id, a starting pod's
            # recovery claims PENDING work that a live sibling is still running.
            # The app does not invent an id; it feeds DBOS's own variable.
            - name: DBOS__VMID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            # The same name again, under the app's own setting, so the pod can
            # recognise its own rows and derive stable workflow ids.
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          # No readiness probe, even though there is now a Service. Readiness
          # answers "is this pod well enough for its own Service", and the
          # version cutover is a different question, answered by the Service
          # selector. A readiness probe here would also be actively wrong: a pod
          # finishing an old version's backlog is healthy, and marking it
          # NotReady would say otherwise while changing nothing about routing.
          #
          # No liveness probe either — it would risk restarting a pod mid-drain.
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
      volumes:
        - name: dotenv
          secret:
            secretName: dbos-poc-db
            defaultMode: 0440
            # Only the dotenv key. Without this the POSTGRES_* fields would be
            # projected too, and the app has no business reading them.
            items:
              - key: .env
                path: .env
---
# One budget for each version's fleet, not one for all of them.
#
# It bounds *voluntary* disruption: node drains, autoscaler scale-downs and
# upgrades go through the eviction API, which a budget can refuse. Without it,
# draining a node that hosts every replica of a version removes that whole fleet
# at once, and its work has no pod of its version left to finish it.
#
# The selector carries the version for a reason. A budget matching both fleets at
# once would compute its allowance across two Deployments, so a disruption to the
# new version would consume the old version's protection.
#
# `make retire` deletes this alongside the Deployment, selecting both by the
# version label. Nothing else would: it is a separate object, and a Deployment
# does not own it.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: __DEPLOY_NAME__
  namespace: dbos-poc
  labels:
    app: dbos-poc
    version: "__VERSION__"
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app: dbos-poc
      version: "__VERSION__"
