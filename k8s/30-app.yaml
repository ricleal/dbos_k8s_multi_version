# One Deployment for each DBOS version — v0, v1 — not for each release.
#
# The name carries the DBOS version, which is the MAJOR component of
# project.version (see poc/config.py dbos_version). That single choice decides
# which of two very different things a deploy does:
#
#   * 0.1.2 -> 0.1.3, or 0.1.3 -> 0.2.0. Same DBOS version, so this same object
#     is re-applied with a new image and Kubernetes performs an ordinary rolling
#     update. Safe without any draining: the new pods share the old pods'
#     application_version, so they may dequeue that work directly, and orphan
#     recovery hands them any PENDING rows. Most deploys take this path.
#   * 0.2.0 -> 1.0.0. New DBOS version, so a NEW Deployment appears beside this
#     one. Nothing is replaced. The old fleet keeps its pods Running, loses its
#     API traffic when k8s/26-service.yaml moves its selector, and finishes the
#     backlog it already owns — for an hour, if that is how long it takes.
#
# `make retire`, run from cron every five minutes, deletes this object once its
# version owns no active work, or once it has coexisted with a newer version
# past RETIRE_MAX_AGE_SEC. That deletion is what finally sends SIGTERM to these
# pods. The app itself cannot do it: it has no rights to write to the cluster.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: __DEPLOY_NAME__
  namespace: dbos-poc
  labels:
    app: dbos-poc
    # Read by `make retire` to find this fleet and delete it. It is on the
    # Deployment as well as the pods, so a version is identifiable even before
    # its pods exist.
    version: "__VERSION__"
spec:
  # No replicas field. The ScaledObject at the bottom of this file owns the
  # replica count, and a value here would fight it: every `kubectl apply` would
  # reset the count and KEDA would move it back on its next poll. Kubernetes
  # defaults a new Deployment to 1, and KEDA takes it from there.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # For the same-DBOS-version path only. maxUnavailable: 0 is load-bearing:
      # a pod leaving without draining relies on a live sibling of its own
      # version to adopt its PENDING rows, so there must always be one.
      maxSurge: 100%
      maxUnavailable: 0
  selector:
    matchLabels:
      app: dbos-poc
      # Includes the version, so this Deployment only ever owns its own pods.
      # Without it, every Deployment would claim every app pod.
      version: "__VERSION__"
  template:
    metadata:
      labels:
        app: dbos-poc
        # Read by poc/k8s.py: this is how the API server answers "which executors
        # of version X are alive". The DBOS version, so it does not churn on a
        # patch release.
        version: "__VERSION__"
        # Observability only, never read by any logic: which release is running
        # inside this DBOS version.
        code-version: "__CODE_VERSION__"
    spec:
      # No terminationGracePeriodSeconds, so Kubernetes uses its 30s default, and
      # the app does not need even that: it installs no signal handler, so
      # SIGTERM ends the process at once.
      #
      # Nothing is lost by that. A version is retired only once `make retire`
      # sees it own no active work, so SIGTERM arrives when there is nothing left
      # to finish. For an unplanned stop — a node drain, an eviction, a lost
      # machine — the pod's PENDING rows are adopted by a live sibling of the same
      # version within a sweep, from their last completed step.
      #
      # A long grace period was never the answer here anyway. It is a promise the
      # platform may not keep: `kubectl drain` waits it out in full,
      # cluster-autoscaler force-deletes after --max-graceful-termination-sec
      # (10 minutes by default), and spot preemption gives 30s-2min. Long work
      # outlives the rollout instead, in its own fleet.
      serviceAccountName: dbos-poc
      initContainers:
        - name: wait-for-postgres
          image: postgres:17-alpine
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef: { name: dbos-poc-db, key: POSTGRES_USER }
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef: { name: dbos-poc-db, key: POSTGRES_DB }
          command:
            - sh
            - -c
            - until pg_isready -h postgres -U "$POSTGRES_USER" -d "$POSTGRES_DB"; do sleep 1; done
      containers:
        - name: app
          image: __IMAGE__
          imagePullPolicy: Never
          ports:
            # Named, because k8s/26-service.yaml targets the name rather than the
            # number. The port can move without touching the Service.
            - name: http
              containerPort: 8080
          # No preStop hook. Its usual job is to delay SIGTERM while a Service
          # drops the pod from its endpoints. Here the Service selector moves to
          # the new version instead, long before SIGTERM, so there is nothing for
          # a hook to wait for.
          volumeMounts:
            # The database URL arrives as a file, not an environment variable:
            # k8s/05-secret.yaml projected at /app/.env, which is exactly where
            # pydantic-settings looks (`env_file=".env"` in poc/config.py, and
            # the image's WORKDIR is /app). subPath mounts the single file
            # without shadowing the rest of /app.
            - name: dotenv
              mountPath: /app/.env
              subPath: .env
              readOnly: true
          env:
            # DBOS derives executor_id from DBOS__VMID, falling back to the shared
            # literal "local". An executor id identifies one running process, so
            # every replica needs its own: with a shared id, a starting pod's
            # recovery claims PENDING work that a live sibling is still running.
            # The app does not invent an id; it feeds DBOS's own variable.
            - name: DBOS__VMID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            # The same name again, under the app's own setting, so the pod can
            # recognise its own rows and derive stable workflow ids.
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          # No readiness probe, even though there is now a Service. Readiness
          # answers "is this pod well enough for its own Service", and the
          # version cutover is a different question, answered by the Service
          # selector. A readiness probe here would also be actively wrong: a pod
          # finishing an old version's backlog is healthy, and marking it
          # NotReady would say otherwise while changing nothing about routing.
          #
          # No liveness probe either — it would risk restarting a pod that is
          # working through a backlog nothing else may run.
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
      volumes:
        - name: dotenv
          secret:
            secretName: dbos-poc-db
            defaultMode: 0440
            # Only the dotenv key. Without this the POSTGRES_* fields would be
            # projected too, and the app has no business reading them.
            items:
              - key: .env
                path: .env
---
# One budget for each version's fleet, not one for all of them.
#
# It bounds *voluntary* disruption: node drains, autoscaler scale-downs and
# upgrades go through the eviction API, which a budget can refuse. Without it,
# draining a node that hosts every replica of a version removes that whole fleet
# at once, and its work has no pod of its version left to finish it.
#
# The selector carries the version for a reason. A budget matching both fleets at
# once would compute its allowance across two Deployments, so a disruption to the
# new version would consume the old version's protection.
#
# `make retire` deletes this alongside the Deployment, selecting both by the
# version label. Nothing else would: it is a separate object, and a Deployment
# does not own it.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: __DEPLOY_NAME__
  namespace: dbos-poc
  labels:
    app: dbos-poc
    version: "__VERSION__"
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app: dbos-poc
      version: "__VERSION__"
---
# A second Service, for this version only, and the reason it has to exist.
#
# k8s/26-service.yaml is the cutover: its selector names one version, and a
# deploy moves it. That makes it useless to KEDA. An old fleet still needs
# scaling while it works through its backlog, and the cutover Service no longer
# resolves to it — polling that Service would report the NEW version's depth and
# scale the old fleet by it.
#
# So each fleet gets a stable address of its own, named after the fleet. Only
# KEDA uses it. Callers keep using the cutover Service, which is what makes an
# old version invisible to traffic and still visible to its autoscaler.
apiVersion: v1
kind: Service
metadata:
  name: __DEPLOY_NAME__
  namespace: dbos-poc
  labels:
    app: dbos-poc
    version: "__VERSION__"
spec:
  selector:
    app: dbos-poc
    version: "__VERSION__"
  ports:
    - name: http
      port: 80
      targetPort: http
---
# Autoscaling on queue depth, the pattern DBOS documents for Kubernetes:
# https://docs.dbos.dev/production/hosting-with-kubernetes#scaling-with-keda
#
# KEDA polls the app's own /metrics/{queue} endpoint through the Service above
# and reads one JSON field. No Prometheus and no OpenTelemetry are involved:
# DBOS exports no metrics over OTLP, so an app endpoint is both the documented
# route and the shortest one. KEDA computes
#
#   desiredReplicas = ceil(queue_length / targetValue)
#
# and drives a HorizontalPodAutoscaler it creates and owns.
#
# The endpoint reports the depth of THIS version only — see queue_depth() in
# poc/server.py. That is the one change this per-version design forces on the
# DBOS recipe, and without it each fleet would scale on the other's work.
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: __DEPLOY_NAME__
  namespace: dbos-poc
  labels:
    app: dbos-poc
    version: "__VERSION__"
spec:
  scaleTargetRef:
    name: __DEPLOY_NAME__
  # How often KEDA calls the endpoint. It governs the 0 -> 1 decision on its
  # own; from 1 upwards the HPA below drives, on its own 15s sync.
  pollingInterval: 15
  # No cooldownPeriod, deliberately, though the DBOS example sets one. It
  # applies ONLY to scaling back to zero, and minReplicaCount is 1 here, so the
  # field would be dead configuration that reads like a scale-down control.
  # The real scale-down control is the stabilization window under `advanced`.
  #
  # NEVER 0, even though KEDA supports it and an idle fleet would be cheaper.
  # Scaling counts ENQUEUED and PENDING work but not DELAYED, so a fleet holding
  # only a sleeping workflow would scale to zero and have no pod to wake it —
  # while `make retire` would refuse to remove the fleet, because DELAYED *is*
  # active work. The fleet would sit at zero until the 24-hour deadline. One pod
  # is the floor; retirement is what removes the last one.
  minReplicaCount: __MIN_REPLICAS__
  maxReplicaCount: __MAX_REPLICAS__
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        # Kubernetes defaults this window to 300s, so without this block a fleet
        # that emptied keeps all its pods for five minutes. Measured here: depth
        # reached 0 and the fleet was still at its ceiling of 10 a minute later.
        #
        # 60s instead. Long enough that a lull between bursts does not cost a
        # round of pod churn — every scale-down replays the step in progress on
        # another pod — and short enough that the fleet is elastic, which is the
        # only reason to autoscale it at all.
        #
        # Scale-UP is left at the Kubernetes default, which is immediate. A
        # backlog is a queue of work already accepted, so there is nothing to
        # gain by damping the response to it.
        scaleDown:
          stabilizationWindowSeconds: 60
  triggers:
    - type: metrics-api
      metadata:
        url: "http://__DEPLOY_NAME__.dbos-poc.svc.cluster.local/metrics/__QUEUE_NAME__"
        valueLocation: "queue_length"
        # Match worker_concurrency: one replica per targetValue queued
        # workflows is exactly one replica per worker slot.
        targetValue: "__TARGET_VALUE__"
