# One read, and nothing else.
#
# Reading pods is the liveness oracle: DBOS keeps no register of live executors,
# so the API server answers "does the pod that claimed this row still exist".
# That is the whole reason this app holds any cluster credential.
#
# It cannot read Deployments and it cannot delete anything. Retiring a version
# needs both, and that decision belongs to an operator outside the cluster:
# `make retire`, run from cron. An application that can delete its own fleet is
# a larger blast radius than an application that can list pods.
#
# Cancelling stranded work is a database write, not a Kubernetes one.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dbos-poc
  namespace: dbos-poc
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: dbos-poc-fleet
  namespace: dbos-poc
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: dbos-poc-fleet
  namespace: dbos-poc
subjects:
  - kind: ServiceAccount
    name: dbos-poc
    namespace: dbos-poc
roleRef:
  kind: Role
  name: dbos-poc-fleet
  apiGroup: rbac.authorization.k8s.io
