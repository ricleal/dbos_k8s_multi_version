# The one place the database credentials are written.
#
# Postgres reads the individual fields; the app gets the composed URL as a
# dotenv file projected at /app/.env, which is where pydantic-settings looks
# (`env_file=".env"` in poc/config.py) and what `make dbos_reset` sources.
#
# NOTE: a Secret is base64, not encryption. Committing this one is fine only
# because these are throwaway PoC credentials for a local cluster. For anything
# real, create it out of band —
#   kubectl -n dbos-poc create secret generic dbos-poc-db \
#     --from-literal=POSTGRES_USER=... --from-file=.env=./prod.env
# — or manage it with SOPS or External Secrets, and delete this file.
apiVersion: v1
kind: Secret
metadata:
  name: dbos-poc-db
  namespace: dbos-poc
type: Opaque
stringData:
  POSTGRES_USER: dbos
  POSTGRES_PASSWORD: dbos
  POSTGRES_DB: dbos_poc
  # Mounted into the app pod as /app/.env. Keep in sync with the fields above:
  # nothing composes this URL for us.
  .env: |
    DBOS_SYSTEM_DATABASE_URL=postgresql://dbos:dbos@postgres:5432/dbos_poc?sslmode=disable
